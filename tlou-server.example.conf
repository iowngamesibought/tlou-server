# tlou-server configuration. Copy to tlou-server.conf; relative paths resolve
# from this file. Keep the copy and the files it names out of version control.

# This machine's IPv4 address as the consoles see it. `prepare` writes it in
# place of the game's own server addresses, so it must not be longer than
# them: up to 12 characters (e.g. 192.168.1.10) replaces every one; longer
# addresses need `prepare --keep-unfitting` (see README).
public_ip = "CHANGE-ME"
# bind_ip = 0.0.0.0
# http_port = 80          # content downloads, profile and game-record uploads
# ticket_port = 7320      # sign-in ticket and the other framed services
# session_port = 7314     # matchmaking rooms
# location_port = 7312
# voice_port = 7313
keys_file = "game/keys.txt"     # from: tlou-server extract-keys --elf <executable> --out game/keys.txt
content_dir = "content"         # from: tlou-server prepare ... --out content
storage_dir = "storage"         # profiles, game records, leaderboard
# log_file = "logs/tlou-server.log"
# "transport" accepts any intact ticket frame WITHOUT verifying the platform
# signature: only for a private LAN whose consoles the platform signed in.
# "deny" refuses every sign-in.
ticket_trust = "transport"
# profile_uploads = "session"   # keep uploads only from addresses with a live session ("any" keeps all)
# missing_content = "empty-200" # or "404"; clients carry on past an empty 200
# location = "1.0 1.0"          # latitude longitude; never "0 0"
